<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Private Access</title>

    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="animation.css">
    <link rel="stylesheet" href="responsive.css">
</head>

<body>

    <main id="app">

        <!-- =========================
             PASSWORD SCREEN
        ========================== -->

        <section class="screen password-screen" id="passwordScreen">

            <div class="password-card">

                <div class="lock-icon">
                    🔐
                </div>

                <p class="eyebrow">
                    PRIVATE ACCESS
                </p>

                <h1>
                    A Little Something<br>
                    <span>For You</span>
                </h1>

                <p class="subtitle">
                    This little world is only for you.
                </p>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="passwordInput"
                        placeholder="Enter password"
                        autocomplete="off"
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

                <button
                    class="primary-btn"
                    id="unlockBtn"
                >
                    <span>UNLOCK</span>
                    <span>♡</span>
                </button>

                <p
                    class="error-message"
                    id="passwordError"
                ></p>

                <div class="bottom-line">
                    <span></span>
                    <small>PRIVATE • PERSONAL • SPECIAL</small>
                    <span></span>
                </div>

            </div>

        </section>


        <!-- =========================
             APP CONTENT
             (NEXT STEPS WILL COME HERE)
        ========================== -->

        <section
            class="screen hidden"
            id="missionScreen"
        >
            <!-- Mission screen will be added next -->
        </section>

    </main>


    <script src="config.js"></script>
    <script src="app.js"></script>

</body>
</html>
